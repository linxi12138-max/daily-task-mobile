<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4257b2">
  <title>每日任务</title>
  <style>
    :root {
      --ink: #1d2451;
      --muted: #68729d;
      --brand: #5265cf;
      --brand-dark: #3e4fb0;
      --paper: #ffffff;
      --canvas: #f2f4ff;
      --mint: #dcf6e8;
      --gold: #fff1bb;
      --line: #e3e6f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 15% 0%, #dfe5ff 0, transparent 34rem), var(--canvas);
    }

    main {
      width: min(100%, 680px);
      margin: 0 auto;
      padding: 28px 18px calc(32px + env(safe-area-inset-bottom));
    }

    .hero { padding: 8px 4px 22px; }
    .eyebrow { color: var(--brand); font-weight: 800; font-size: 13px; letter-spacing: .08em; }
    h1 { margin: 6px 0 8px; font-size: clamp(30px, 8vw, 42px); letter-spacing: -.04em; }
    .sub { margin: 0; color: var(--muted); line-height: 1.65; }

    .card {
      margin-top: 16px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 12px 35px rgba(70, 83, 155, .11);
    }

    .topline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .label { color: var(--muted); font-size: 14px; font-weight: 700; }
    .person { margin: 8px 0 0; font-size: 27px; font-weight: 850; }
    .badge { padding: 7px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .badge.instant { background: var(--mint); color: #16734b; }
    .badge.points { background: var(--gold); color: #986b00; }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      color: white;
      background: var(--brand);
      box-shadow: 0 8px 18px rgba(82, 101, 207, .28);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }

    button:active { transform: scale(.98); }
    button:hover { background: var(--brand-dark); }
    button.secondary { color: var(--brand); background: #edf0ff; box-shadow: none; }
    button:disabled { cursor: not-allowed; color: #7f87ac; background: #e5e8f6; box-shadow: none; }

    .tasks { display: grid; gap: 10px; margin: 18px 0; }
    .task {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fbfbff;
      line-height: 1.45;
    }
    .task input { width: 20px; height: 20px; margin: 0; accent-color: var(--brand); flex: 0 0 auto; }
    .task:has(input:checked) { color: #66709d; text-decoration: line-through; background: #f5f6fc; }

    .reward { margin: 18px 0; padding: 16px; border-radius: 17px; background: #f0f2ff; }
    .reward strong { display: block; margin-bottom: 5px; color: var(--brand-dark); font-size: 14px; }
    .reward p { margin: 0; line-height: 1.55; font-weight: 750; }
    .points-info { display: flex; gap: 12px; align-items: center; margin: 16px 0; padding: 15px; border-radius: 16px; background: #fff9df; }
    .points-num { color: #a06f00; font-size: 26px; font-weight: 900; }
    .points-copy { color: #786534; line-height: 1.5; font-size: 13px; }

    .hidden { display: none; }
    #status { min-height: 24px; margin: 14px 2px 0; color: #56628e; text-align: center; font-size: 14px; }
    footer { margin-top: 24px; color: #8890b5; text-align: center; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="eyebrow">DAILY PLAN</div>
      <h1>今天做什么？</h1>
      <p class="sub">抽取一位任务主人，完成三项小目标，再收下属于你的奖励。</p>
    </section>

    <section class="card">
      <button id="drawButton" type="button">抽取今日任务</button>
    </section>

    <section id="planCard" class="card hidden" aria-live="polite">
      <div class="topline">
        <div>
          <div class="label">今天的任务主人</div>
          <div id="personName" class="person"></div>
        </div>
        <span id="rewardBadge" class="badge"></span>
      </div>

      <div id="tasks" class="tasks"></div>

      <div class="reward">
        <strong>完成任务后的奖励</strong>
        <p id="rewardText"></p>
      </div>

      <div id="pointsPanel" class="hidden">
        <div class="points-info">
          <div id="pointsNumber" class="points-num">0 分</div>
          <div class="points-copy">当前累计积分<br>每完成一项可获得 10 分</div>
        </div>
        <button id="scoreButton" type="button">按已完成任务计算积分</button>
      </div>

      <div id="instantPanel" class="hidden">
        <button id="claimButton" type="button">我已完成三项任务，领取奖励</button>
      </div>

      <p id="status"></p>
      <button id="redrawButton" class="secondary" type="button">重新抽取</button>
    </section>

    <footer>积分仅保存在当前手机浏览器中。</footer>
  </main>

  <script>
    const people = {
      "小王": {
        type: "instant",
        tasks: [
          "练习 20 分钟代码编程",
          "完成一道 NumPy 数组题",
          "阅读 15 分钟机器学习代码",
          "写一个带 if 判断的小程序",
          "复习函数和 return 的用法",
          "整理复盘当天的工作内容",
          "锻炼或散步 20 分钟"
        ],
        rewards: ["喝一杯喜欢的饮料", "玩 30 分钟游戏", "吃一顿好吃的", "健身日可任意休息一次"]
      },
      "小朱子怡": {
        type: "points",
        pointsPerTask: 10,
        tasks: [
          "背诵 60 个英语单词",
          "完成今天的做饭目标",
          "完成一题数学或编程练习",
          "整理复盘当天的工作内容",
          "锻炼或散步 20 分钟"
        ]
      }
    };

    const storeKey = "daily-task-mobile-points-v1";
    let activePlan = null;
    let scored = false;

    const $ = (id) => document.getElementById(id);
    const choose = (items, count = 1) => [...items].sort(() => Math.random() - 0.5).slice(0, count);

    function getPoints() {
      try { return JSON.parse(localStorage.getItem(storeKey)) || {}; }
      catch { return {}; }
    }

    function savePoints(points) {
      localStorage.setItem(storeKey, JSON.stringify(points));
    }

    function renderTasks(tasks) {
      $("tasks").innerHTML = "";
      tasks.forEach((task, index) => {
        const label = document.createElement("label");
        label.className = "task";
        label.innerHTML = `<input type="checkbox" data-task="${index}"><span>${index + 1}. ${task}</span>`;
        $("tasks").appendChild(label);
      });
    }

    function drawPlan() {
      const name = choose(Object.keys(people))[0];
      const person = people[name];
      activePlan = { name, person, tasks: choose(person.tasks, 3) };
      scored = false;

      $("personName").textContent = name;
      $("planCard").classList.remove("hidden");
      $("status").textContent = "";
      renderTasks(activePlan.tasks);

      const isPoints = person.type === "points";
      $("rewardBadge").textContent = isPoints ? "积分奖励" : "即时奖励";
      $("rewardBadge").className = `badge ${isPoints ? "points" : "instant"}`;
      $("pointsPanel").classList.toggle("hidden", !isPoints);
      $("instantPanel").classList.toggle("hidden", isPoints);

      if (isPoints) {
        const current = getPoints()[name] || 0;
        $("pointsNumber").textContent = `${current} 分`;
        $("rewardText").textContent = `每完成 1 项任务获得 ${person.pointsPerTask} 积分；累计到 100 分可兑换一次周末自由活动。`;
        $("scoreButton").disabled = false;
        $("scoreButton").textContent = "按已完成任务计算积分";
      } else {
        activePlan.reward = choose(person.rewards)[0];
        $("rewardText").textContent = `全部完成后，可以获得：${activePlan.reward}。`;
        $("claimButton").disabled = false;
        $("claimButton").textContent = "我已完成三项任务，领取奖励";
      }

      $("planCard").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function scorePlan() {
      if (scored || !activePlan) return;
      const completed = document.querySelectorAll("[data-task]:checked").length;
      const earned = completed * activePlan.person.pointsPerTask;
      const points = getPoints();
      const total = (points[activePlan.name] || 0) + earned;
      points[activePlan.name] = total;
      savePoints(points);
      scored = true;

      $("pointsNumber").textContent = `${total} 分`;
      $("scoreButton").disabled = true;
      $("status").textContent = `本次完成 ${completed} 项，获得 ${earned} 积分；当前累计 ${total} 分。`;
    }

    function claimReward() {
      if (!activePlan) return;
      const completed = document.querySelectorAll("[data-task]:checked").length;
      if (completed < 3) {
        $("status").textContent = `已完成 ${completed} 项，再完成 ${3 - completed} 项就能领取奖励。`;
        return;
      }
      $("claimButton").disabled = true;
      $("status").textContent = `恭喜 ${activePlan.name}！请领取奖励：${activePlan.reward}。`;
    }

    $("drawButton").addEventListener("click", drawPlan);
    $("redrawButton").addEventListener("click", drawPlan);
    $("scoreButton").addEventListener("click", scorePlan);
    $("claimButton").addEventListener("click", claimReward);
  </script>
</body>
</html>
